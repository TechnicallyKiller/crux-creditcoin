[profile.default]
src = "src"
out = "out"
libs = ["/home/divyanshh1/credit-coin/node_modules", "lib"]
test = "test"
script = "script"
solc_version = "0.8.23"
optimizer = true
optimizer_runs = 200
evm_version = "london"  # CC3 is Frontier-based: block headers carry no prevrandao,
                        # which shanghai's fork header validation requires.
fs_permissions = [
  { access = "read", path = "../fixtures" },
  { access = "read-write", path = "../deployments" },
]

# EvmV1Decoder exposes `public` functions, so it is a DEPLOYED library that must
# be LINKED, not inlined. Attestcoin publishes one per network (plan §16), so we
# link against theirs rather than deploying our own.
libraries = [
  "../node_modules/@gluwa/usc-contracts/contracts/decoding/EvmV1Decoder.sol:EvmV1Decoder:0x731c345d79Fb8BbDC541f9DF3b6317585F849F9f",
]

[rpc_endpoints]
cc3_testnet = "${CC3_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
cc3_testnet = { key = "any", url = "https://creditcoin-testnet.blockscout.com/api", chain = 102031 }
