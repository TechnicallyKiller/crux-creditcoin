[profile.default]
src = "src"
out = "out"
libs = ["/home/divyanshh1/credit-coin/node_modules", "lib"]
test = "test"
script = "script"
solc_version = "0.8.23"
optimizer = true
optimizer_runs = 200
evm_version = "london"  # CC3 is Frontier-based: block headers carry no prevrandao,
                        # which shanghai's fork header validation requires.
fs_permissions = [
  { access = "read", path = "../fixtures" },
  { access = "read-write", path = "../deployments" },
]

# EvmV1Decoder exposes `public` functions, so it is a DEPLOYED library that must
# be LINKED, not inlined.
#
# Deliberately NOT pinned to Attestcoin's published instance (0x731c... on CC3).
# A `libraries` entry here is normalised to an absolute path, while the
# compilation unit keys the source relatively, so the entry silently never
# matches and forge deploys its own copy anyway — the failure mode is a
# confusing surplus deployment, not an error. Letting forge deploy it is
# cheaper than fighting that: it goes through the CREATE2 deterministic
# deployer, so every redeploy reuses the SAME address, which is exactly the
# idempotence R5 wants after a testnet reset. Costs ~0.004 tCTC, once.

[rpc_endpoints]
cc3_testnet = "${CC3_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
cc3_testnet = { key = "any", url = "https://creditcoin-testnet.blockscout.com/api", chain = 102031 }
